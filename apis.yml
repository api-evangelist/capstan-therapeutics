aid: capstan-therapeutics
name: Capstan Therapeutics
description: 'Capstan Therapeutics was a clinical-stage biotechnology company based in San Diego,
  California, developing in vivo cell engineering medicines built on a proprietary targeted lipid
  nanoparticle (tLNP) platform that delivers mRNA and other RNA payloads to specific cell types inside
  the body. Its lead candidate CPTX2309 is an anti-CD19 in vivo CAR-T therapy in Phase 1 for B
  cell-mediated autoimmune disease, intended to achieve deep B cell depletion without lymphodepleting
  chemotherapy. AbbVie completed its acquisition of Capstan on 19 August 2025 for up to $2.1 billion.
  The company''s own domain now redirects to AbbVie and its DNS is served by AbbVie nameservers; it
  operates no developer program, public API, SDK, or machine-readable specification.'
